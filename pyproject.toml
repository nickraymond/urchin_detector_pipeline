[project]
name = "urchin-detector-pipeline"
version = "0.1.0"
description = "Local labeling tool: GoPro videos -> frames -> SAM labels -> COCO boxes + masks"
requires-python = ">=3.12,<3.13"
dependencies = [
    # PyTorch from PyPI: the macOS arm64 wheels include the Apple GPU (MPS) backend.
    # Pinned to 2.10.0, the version in Meta's sam3 readme. torch 2.15.0 aborts on the
    # Apple GPU on macOS 14.6 (a plain Conv2d; 2.8-2.14 pass the same test, 2026-11-24).
    "torch==2.10.0",
    "torchvision",
    "pillow",
    "numpy>=1.26,<2",
    # Meta's official SAM 3 / 3.1 code, pinned to the commit read on 2026-11-24.
    # Licence: SAM License (see the LICENSE file in that repo). Labeling tool only.
    "sam3 @ git+https://github.com/facebookresearch/sam3@31cb7e624e4fe95301b1be1d4e809111593d2e45",
    # sam3 imports pkg_resources but does not declare it.
    "setuptools<81",
    # sam3 imports these on the image path but does not declare them.
    "psutil",   # also the S4 memory guard's free-memory figure (D36); BSD-3-Clause (7.2.2 metadata)
    "einops",
    "scipy",
    "pycocotools",
    # S2 web app (D12). Licences from PyPI metadata, 2026-11-24: fastapi MIT,
    # uvicorn BSD-3-Clause, Jinja2 BSD, python-multipart Apache-2.0 (form posts);
    # starlette, pulled in by fastapi: BSD-3-Clause.
    "fastapi>=0.165.0",
    "uvicorn>=0.54.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.34",
    # S3 classes.yaml (D25): read with safe_load, written with safe_dump only. Licence MIT
    # (PyPI metadata of PyYAML 6.0.4, read 2026-11-25); already installed through sam3.
    "pyyaml>=6.0.4",
    # S5 export: COCO polygon outlines from masks (marching squares). BSD-3-Clause (PyPI metadata
    # of contourpy 1.3.3, read 2026-11-25); 1.4 needs numpy 2.
    "contourpy>=1.3,<1.4",
]

[project.scripts]
sam-test = "app.sam_test.run:main"
app = "app.web.server:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",  # FastAPI test client; BSD-3-Clause
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
