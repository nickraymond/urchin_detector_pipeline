# Starting classes for SAM labeling (DESIGN, Planned for S3). Copied into a project as
# classes.yaml on first use. Comments are not kept when the file is saved from the browser.
settings:
  model: sam3              # facebook/sam3, sam3.pt (D10)
  confidence: 0.4          # spec; D24
  tile_px: 1008            # D10, D23
  tile_overlap: 0.2        # spec
  tile_above_px: 2000      # frames wider than this are tiled (spec)
  min_mask_area_px: 500    # below the smallest real urchin seen, 948 px (S3 bite 3, D24)
classes:
  # ids are fixed: never renumbered or reused (D6); 0 means unknown.
  # One SAM prompt, "urchin", for every urchin type; the type is tagged by hand in label review (D18, D39).
  - {id: 1, name: purple urchin, kind: object, prompts: [urchin], sam_group: urchin}
  - {id: 2, name: red urchin, kind: object, prompts: [urchin], sam_group: urchin}
  # A third urchin type (SPEC Q18, D39); its name may change later, its id never does.
  - {id: 10, name: black urchin, kind: object, prompts: [urchin], sam_group: urchin}
  - {id: 3, name: sea star, kind: object, prompts: [sea star]}
  - {id: 4, name: sunflower sea star, kind: object, prompts: [sunflower sea star]}
  - {id: 5, name: anemone, kind: object, prompts: [sea anemone]}
  - {id: 6, name: fish, kind: object, prompts: [fish]}
  # Kelp prompts picked on 6 restoration frames (S3 bite 3, DESIGN Bench). Shoot pixels count as kelp (D22).
  - {id: 8, name: kelp shoot, kind: object, prompts: [young kelp], seg_as: kelp}
  # Areas listed first win where two areas overlap: kelp before rock/substrate (D22).
  - {id: 9, name: kelp, kind: area, prompts: [kelp]}
  - {id: 7, name: rock/substrate, kind: area, prompts: [rock]}
